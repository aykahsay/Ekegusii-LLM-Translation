[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ekegusii-llm-translation"
version = "1.0.0"
description = "Resource-Aware Adaptation of Multilingual Large Language Models for Low-Resource Machine Translation: A Case Study on Ekegusii"
readme = "README.md"
authors = [
    { name = "Aykahsay Research Team", email = "research@ekegusii-nlp.org" }
]
license = { text = "MIT" }
keywords = ["NLP", "Machine Translation", "Ekegusii", "Low-Resource", "LLM", "QLoRA", "Qwen2.5", "Llama-3.1"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.2",
    "datasets>=2.17.0",
    "peft>=0.9.0",
    "trl>=0.7.11",
    "accelerate>=0.27.2",
    "sacrebleu>=2.4.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "typer>=0.9.0",
    "rich>=13.7.1"
]

[project.urls]
Homepage = "https://github.com/aykahsay/Ekegusii-LLM-Translation"
Repository = "https://github.com/aykahsay/Ekegusii-LLM-Translation.git"

[project.scripts]
ekegusii-nmt = "src.cli.main:app"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # convention
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501"] # Line length handled by Black

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src"
testpaths = ["tests"]
python_files = ["test_*.py"]
