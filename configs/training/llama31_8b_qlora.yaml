model:
  name_or_path: meta-llama/Meta-Llama-3.1-8B-Instruct
  torch_dtype: bfloat16
qlora:
  lora_alpha: 64
  lora_dropout: 0.05
  r: 32
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
training:
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  num_train_epochs: 4
  per_device_train_batch_size: 8
  warmup_ratio: 0.1
