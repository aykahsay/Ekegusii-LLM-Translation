# QLoRA Parameter-Efficient Fine-Tuning (PEFT) Specification

peft:
  peft_type: "LORA"
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

training_arguments:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  max_grad_norm: 1.0
  num_train_epochs: 4
  warmup_ratio: 0.1
  learning_rate: 0.0002
  fp16: false
  bf16: true
