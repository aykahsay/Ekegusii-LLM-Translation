# Master Lexical Corpus -- dictionary-level entries used for lexical
# augmentation (E6) and rare-word/terminology evaluation.

name: lexical
description: >-
  Dictionary entries (English-Kiswahili-Ekegusii) used to generate
  lexical-augmentation instruction tasks (E6) and to evaluate rare-word /
  terminology translation accuracy.

corpus_path: data/master_corpus/master_lexical_corpus.csv

columns:
  id: lexicon_id
  languages: [English, Kiswahili, Ekegusii]
  source: source

expected_rows: 268

notes: >-
  As of this writing, ALL 268 rows have an empty English column (verified:
  0/268 non-null) -- the lexical corpus is currently Kiswahili<->Ekegusii
  only, despite the schema having an English column. Consumers must not
  assume any English-language lexical tasks can be generated until this is
  populated; LexicalTaskGenerator (src/task_generation/lexical_tasks.py)
  will silently produce zero ENG-direction tasks under the current data.
