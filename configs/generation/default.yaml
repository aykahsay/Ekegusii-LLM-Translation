# Default decoding profile: deterministic beam search. Used for all
# automatic-metric evaluation (SacreBLEU/chrF/COMET) so scores are
# reproducible across runs -- MT evaluation should not use sampling, since
# comparing experiments under stochastic decoding would confound the
# resource-contribution signal with decoding noise.

max_new_tokens: 256
min_new_tokens: 1
num_beams: 4
do_sample: false
length_penalty: 1.0
repetition_penalty: 1.25
no_repeat_ngram_size: 3
early_stopping: true
