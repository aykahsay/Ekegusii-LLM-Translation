# Qwen2.5-7B-Instruct Model Specification Configuration
# Replaced Cohere Aya-23-8B: Aya required gated-repo access approval that
# blocked iteration; Qwen2.5-7B-Instruct is fully open (Apache 2.0, no
# authentication needed) and close in scale to Mistral-7B-Instruct-v0.3.

model:
  name: "qwen_7b"
  hf_path: "Qwen/Qwen2.5-7B-Instruct"
  architecture: "Qwen2ForCausalLM"
  params: "7B"
  torch_dtype: "bfloat16"
  use_fast_tokenizer: true
  trust_remote_code: false

generation:
  max_new_tokens: 256
  min_new_tokens: 1
  do_sample: false
  num_beams: 4
  length_penalty: 1.0
  repetition_penalty: 1.25
  no_repeat_ngram_size: 3
  early_stopping: true

tokenizer:
  padding_side: "left"
  truncation_side: "left"
  max_length: 512
  pad_token_id: null
  eos_token_id: null

target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
