# Mistral-7B-Instruct-v0.3 Model Specification Configuration
# Replaced Meta Llama-3.1-8B-Instruct: Llama required gated-repo access
# approval that blocked iteration; Mistral-7B-Instruct-v0.3 is fully open
# (Apache 2.0, no authentication needed) and shares Llama's module naming
# (q_proj/k_proj/v_proj/o_proj/gate_proj/up_proj/down_proj).

model:
  name: "mistral_7b"
  hf_path: "mistralai/Mistral-7B-Instruct-v0.3"
  architecture: "MistralForCausalLM"
  params: "7B"
  torch_dtype: "bfloat16"
  use_fast_tokenizer: true
  trust_remote_code: false

generation:
  max_new_tokens: 256
  min_new_tokens: 1
  do_sample: false
  num_beams: 4
  length_penalty: 1.0
  repetition_penalty: 1.25
  no_repeat_ngram_size: 3
  early_stopping: true

tokenizer:
  padding_side: "left"
  truncation_side: "left"
  max_length: 512
  pad_token_id: null
  eos_token_id: null

target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
